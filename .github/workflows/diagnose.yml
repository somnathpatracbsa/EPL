name: Diagnose Stuck Matches

# Run this any time you suspect matches are stuck — it diffs Firestore against the
# football-data.org API and prints every discrepancy with the exact Fix Match inputs
# needed to repair each one.

on:
  workflow_dispatch: {}

concurrency:
  group: sync          # same group as the main sync — never run alongside a live sync
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: automation
        run: npm install

      - name: Run diagnostics
        working-directory: automation
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node diagnose-stuck-matches.js
