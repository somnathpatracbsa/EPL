name: Sync & Score EPL Predictions

on:
  schedule:
    # Every 10 minutes — as close to real-time as a free scheduled job reasonably gets.
    # Honest caveat: GitHub's scheduler can lag a few minutes under load, and this is still
    # polling (not a live push), so scores land within ~10-15 min of full time, not instantly.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: automation
        run: npm install

      - name: Run sync and scoring
        working-directory: automation
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node sync-and-score.js
