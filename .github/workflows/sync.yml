name: Sync & Score EPL Predictions

on:
  schedule:
    # Hourly. The previous */10-minute schedule combined with 4 redundant full-collection
    # reads of `fixtures` per run (now fixed in sync-and-score.js) blew through Firestore's
    # free daily quota — roughly 55,000 writes/day against a 20,000 cap, and 200,000+ reads/day
    # against a 50,000 cap. Hourly + the read fix brings this comfortably under both caps.
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: automation
        run: npm install

      - name: Run sync and scoring
        working-directory: automation
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node sync-and-score.js
