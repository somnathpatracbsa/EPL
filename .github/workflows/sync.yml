name: Sync & Score EPL Predictions

on:
  schedule:
    # Runs every 3 hours, all day, every day (UTC). GitHub Actions free tier covers this easily
    # for a public repo (unlimited minutes) or a private repo (2,000 free minutes/month).
    - cron: '0 */3 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab too

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: automation
        run: npm install

      - name: Run sync and scoring
        working-directory: automation
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node sync-and-score.js
