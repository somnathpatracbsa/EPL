name: Sync & Score EPL Predictions

on:
  # No native `schedule:` trigger here anymore — an external cron service (cron-job.org) calls
  # this workflow's dispatch API every hour instead, since GitHub's own scheduled triggers are
  # documented as "best effort" and were observed going many hours late in practice. Keeping
  # BOTH active was a real risk, not just redundant: if GitHub's scheduler happened to fire
  # around the same time as the external trigger, two overlapping runs could race each other
  # writing to Firestore, and — combined with any momentary inconsistency in the API's own
  # data between those two near-simultaneous calls — a stale write landing second could revert
  # a match that was already correctly marked FINISHED back to an earlier status. Removing the
  # native schedule eliminates that race at the source.
  workflow_dispatch: {}

# CRITICAL — prevents overlapping runs from racing each other on Firestore.
#
# The root cause of finished matches reverting to TIMED: Guard 1 in sync-and-score.js
# reads the set of already-FINISHED matches from Firestore at the START of a run. If two
# runs start at nearly the same time (e.g. cron-job.org retries a failed dispatch, or a
# manual re-run overlaps with the hourly trigger), BOTH reads happen before EITHER run has
# committed. So Guard 1 sees an empty (or stale) alreadyFinishedIds in the second run and
# lets the bad API write through. cancel-in-progress: false queues the second run rather
# than discarding it, so no hourly update is ever skipped — the runs just serialise.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: automation
        run: npm install

      - name: Run sync and scoring
        working-directory: automation
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node sync-and-score.js
